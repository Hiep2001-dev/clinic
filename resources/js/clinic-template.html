
    <div class="app-shell">
    <header class="topbar"><a class="brand" href="/clinic"><span class="brand-mark"><img class="brand-logo" :src="content.logo" :alt="content.brand"></span><span>{{ content.brand }}</span></a><div class="topbar-right"><span class="secure"><span class="status-dot"></span> Hệ thống hoạt động</span><button v-if="isAdmin" class="avatar" @click="logout" title="Đăng xuất">LT</button><button v-else class="avatar">LT</button></div></header>
      <div class="workspace">
        <aside class="sidebar"><div class="eyebrow">{{ content.brand }}</div><h1>Chăm sóc đúng<br><em>lúc.</em></h1><p class="side-copy">Đặt lịch khám nhanh chóng, nhẹ nhàng và minh bạch.</p><nav><button v-if="!isAdmin" class="active"><span>◫</span> Đặt lịch khám</button><button v-if="isAdmin" class="active"><span>▦</span> Quản trị lịch hẹn</button></nav><div class="side-footer"><div class="help-icon">?</div><div><strong>{{ content.support.title }}</strong><small v-for="phone in content.support.phones" :key="phone">{{ phone }}<br></small></div></div></aside>
        <main class="main-content">
          <div v-if="loading" class="loading"><div class="spinner"></div>Đang tải dữ liệu phòng khám...</div>
          <template v-else-if="view === 'patient'">
            <section class="page-heading"><div><div class="eyebrow blue">{{ content.patient.eyebrow }}</div><h2>{{ content.patient.title }}</h2><p>{{ content.patient.description }}</p></div><div class="trust-note"><span>✦</span><div><strong>{{ content.patient.tagline }}</strong><small>{{ content.patient.taglineDescription }}</small></div></div></section>
            <div class="patient-grid"><section class="booking-panel"><div class="steps"><div v-for="n in 4" :key="n" class="step" :class="{current: step === n, done: step > n}" @click="step > n && (step = n)"><span>{{ step > n ? '✓' : n }}</span><small>{{ ['Dịch vụ','Thời gian','Thông tin','Xác nhận'][n-1] }}</small></div></div>
              <div v-if="step === 1" class="form-stage"><div class="stage-title"><span class="stage-number">01</span><div><h3>Bạn cần khám gì hôm nay?</h3><p>Chọn chuyên khoa hoặc bác sĩ bạn muốn gặp.</p></div></div><div class="service-grid"><button v-for="service in services" :key="service.id" class="service-card" :class="{selected: form.service_id === service.id}" @click="chooseService(service)"><span class="service-icon">{{ service.icon }}</span><strong>{{ service.name }}</strong><small>{{ service.description }}</small><b>→</b></button></div><div class="doctor-select"><label>Hoặc chọn bác sĩ cụ thể</label><select v-model="form.doctor_id"><option value="">Tất cả bác sĩ</option><option v-for="doctor in doctors" :value="doctor.id">{{ doctor.name }} · {{ doctor.specialty }}</option></select></div></div>
              <div v-if="step === 2" class="form-stage"><div class="stage-title"><span class="stage-number">02</span><div><h3>Chọn ngày và khung giờ</h3><p>Khung giờ còn trống được cập nhật theo thời gian thực.</p></div></div><label>Ngày khám<input type="date" v-model="filters.date" :min="new Date().toISOString().slice(0,10)" @change="loadSlots"></label><div class="slot-grid"><button v-for="slot in slots" :key="slot.id" :disabled="!slot.is_enabled || slot.booked_count >= slot.max_patients" :class="{selected: form.time_slot_id === slot.id}" @click="form.time_slot_id = slot.id"><span>{{ time(slot.start_time) }} – {{ time(slot.end_time) }}</span><small>{{ slot.is_enabled ? (slot.max_patients - slot.booked_count) + ' chỗ trống' : 'Tạm ngưng' }}</small></button></div><div class="stage-actions"><button class="button ghost" @click="step = 1">← Quay lại</button><button class="button primary" :disabled="!form.time_slot_id" @click="step = 3">Tiếp tục →</button></div></div>
              <div v-if="step === 3" class="form-stage"><div class="stage-title"><span class="stage-number">03</span><div><h3>Thông tin của bạn</h3><p>Thông tin được bảo mật và chỉ dùng cho lịch hẹn.</p></div></div><div class="form-grid"><label>Họ và tên *<input v-model="form.patient_name" placeholder="Nguyễn Văn A"></label><label>Số điện thoại *<input v-model="form.phone" placeholder="0901 234 567"></label><label>Ngày sinh<input type="date" v-model="form.birth_date"></label><label>Giới tính<select v-model="form.gender"><option value="">Chọn giới tính</option><option>Nam</option><option>Nữ</option><option>Khác</option></select></label><label class="wide">Địa chỉ<input v-model="form.address" placeholder="Số nhà, đường, quận/huyện"></label><label class="wide">Email<input type="email" v-model="form.email" placeholder="email@example.com"></label><label class="wide">Lý do khám / triệu chứng<textarea v-model="form.symptoms" rows="3" placeholder="Mô tả ngắn tình trạng hiện tại..."></textarea></label></div><div class="stage-actions"><button class="button ghost" @click="step = 2">← Quay lại</button><button class="button primary" :disabled="!form.patient_name || !form.phone || saving" @click="submitBooking">{{ saving ? 'Đang xử lý...' : 'Xác nhận đặt lịch →' }}</button></div></div>
              <div v-if="step === 4 && booking" class="success-stage"><div class="success-mark">✓</div><div class="eyebrow blue">ĐẶT LỊCH THÀNH CÔNG</div><h3>Hẹn gặp bạn tại Nhân Đức 3</h3><p>Lịch hẹn của bạn đã được ghi nhận. Vui lòng lưu lại mã đặt lịch.</p><div class="booking-ticket"><div><small>MÃ ĐẶT LỊCH</small><strong>{{ booking.booking_code }}</strong><span>{{ formatDate(booking.appointment_date) }} · {{ time(booking.start_time) }} – {{ time(booking.end_time) }}</span><span>{{ booking.service?.name }}<template v-if="booking.doctor"> · {{ booking.doctor.name }}</template></span></div><img :src="qrUrl" alt="Mã QR lịch hẹn"></div><button class="button primary" @click="reset">Đặt lịch mới</button></div>
            </section><aside class="patient-aside"><div class="aside-card lookup-card"><div class="card-kicker">TRA CỨU NHANH</div><h3>Đã có lịch hẹn?</h3><p>Nhập mã đặt lịch và số điện thoại để xem trạng thái.</p><div class="lookup-input"><input v-model="lookupCode" @keyup.enter="lookup" placeholder="Mã: PK-83921"><input v-model="lookupPhone" @keyup.enter="lookup" placeholder="Số điện thoại"><button @click="lookup">→</button></div><div v-if="lookupResult" class="lookup-result"><span class="status-pill" :class="lookupResult.status">{{ statusLabels[lookupResult.status] }}</span><strong>{{ lookupResult.booking_code }}</strong><small>{{ formatDate(lookupResult.appointment_date) }} · {{ time(lookupResult.start_time) }}</small></div></div><div class="aside-card info-card"><span class="info-symbol">♧</span><h3>Giờ làm việc</h3><ul><li v-for="hour in content.schedule" :key="hour.label">{{ hour.label }}: {{ hour.value }}</li></ul></div></aside></div>
          </template>
          <template v-else>
            <section class="page-heading admin-heading"><div><div class="eyebrow blue">{{ content.admin.eyebrow }}</div><h2>{{ content.admin.title }}</h2><p>{{ content.admin.description }}</p></div><div class="date-control"><span>HÔM NAY</span><input type="date" v-model="filters.date" @change="loadAppointments"></div></section><div class="stat-grid"><div class="stat-card"><span>Tổng lịch hẹn</span><strong>{{ stats.total }}</strong><small>Trong ngày đã chọn</small></div><div class="stat-card accent-yellow"><span>{{ statusLabels.pending }}</span><strong>{{ stats.pending }}</strong><small>Cần xử lý</small></div><div class="stat-card accent-blue"><span>{{ statusLabels.confirmed }}</span><strong>{{ stats.confirmed }}</strong><small>Sẵn sàng đón tiếp</small></div><div class="stat-card accent-green"><span>{{ statusLabels.completed }}</span><strong>{{ stats.completed }}</strong><small>Hoàn tất hôm nay</small></div></div><section class="admin-section"><div class="section-header"><div><h3>Lịch hẹn trong ngày</h3><p>{{ appointments.length }} lịch hẹn được tìm thấy</p></div><div class="filters"><input v-model="filters.search" @input="loadAppointments" placeholder="Tìm tên hoặc SĐT..."><select v-model="filters.status" @change="loadAppointments"><option value="">Tất cả trạng thái</option><option v-for="(label, key) in statusLabels" :value="key">{{ label }}</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Bệnh nhân</th><th>Chuyên khoa</th><th>Khung giờ</th><th>Trạng thái</th><th>Ghi chú nội bộ</th><th></th></tr></thead><tbody><tr v-for="appointment in appointments" :key="appointment.id"><td><strong>{{ appointment.patient_name }}</strong><small>{{ appointment.phone }} · {{ appointment.booking_code }}</small></td><td>{{ appointment.service?.name }}<small>{{ appointment.doctor?.name || 'Chưa chỉ định' }}</small></td><td><strong>{{ time(appointment.start_time) }} – {{ time(appointment.end_time) }}</strong></td><td><select class="status-select" :class="appointment.status" v-model="appointment.status" @change="updateStatus(appointment, appointment.status)"><option v-for="(label, key) in statusLabels" :value="key">{{ label }}</option></select></td><td><input class="note-input" v-model="appointment.internal_note" @change="updateNote(appointment)" placeholder="Thêm ghi chú..."></td><td><button class="more-button" title="Xem chi tiết">•••</button></td></tr><tr v-if="!appointments.length"><td colspan="6" class="empty-state">Chưa có lịch hẹn phù hợp.</td></tr></tbody></table></div></section><section class="admin-section slots-section"><div class="section-header"><div><h3>Điều phối khung giờ</h3><p>Bật/tắt và kiểm soát sức chứa từng khung giờ.</p></div></div><div class="slot-management"><div v-for="slot in slots" :key="slot.id" class="manage-slot" :class="{disabled: !slot.is_enabled}"><div><strong>{{ time(slot.start_time) }} – {{ time(slot.end_time) }}</strong><small>{{ slot.booked_count }}/{{ slot.max_patients }} bệnh nhân</small></div><button class="toggle" :class="{on: slot.is_enabled}" @click="toggleSlot(slot)"><span></span></button></div></div></section>
          </template>
        </main>
      </div>
      <div v-if="toast" class="toast" :class="toast.type"><span>{{ toast.type === 'error' ? '!' : '✓' }}</span>{{ toast.message }}</div>
    </div>
